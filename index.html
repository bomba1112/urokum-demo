  [/^\/pack$/, vPack],
  [/^\/pack\/plan$/, vPlan],
  [/^\/pack\/slides$/, vSlides],
  [/^\/pack\/ws$/, vWS],
  [/^\/pack\/cards$/, vCards],
  [/^\/pack\/info$/, vInfo],
  [/^\/pack\/game$/, vGame],
  [/^\/pack\/dl$/, vDl],
  [/^\/check$/, () => vCheck()],
  [/^\/check\/(g[12])$/, vCheck],
  [/^\/check\/(g[12])\/tasks$/, vCheckTasks],
  [/^\/check\/(g[12])\/key$/, vCheckKey],
  [/^\/check\/(g[12])\/sheet$/, vCheckSheet],
  [/^\/check\/(g[12])\/scan$/, vScan],
  [/^\/check\/(g[12])\/gaps$/, vGaps],
  [/^\/check\/(g[12])\/review\/(K\d)$/, vReview],
  [/^\/create$/, vCreate],
  [/^\/create\/result$/, vCreateResult]
];
function parentOf(p) {
  let m;
  if ((m = p.match(/^\/onb\/(\d)$/))) return '/onb/' + Math.max(1, +m[1] - 1);
  if (p === '/today') return '/onb/3';
  if (p === '/toc' || p === '/pack' || p === '/check') return '/today';
  if (p.startsWith('/topic/')) return '/toc';
  if (p === '/create') return '/today';
  if (p === '/create/result') return '/create';
  if (p.startsWith('/pack/')) return '/pack';
  if ((m = p.match(/^\/check\/(g[12])\/review\//))) return '/check/' + m[1] + '/gaps';
  if ((m = p.match(/^\/check\/(g[12])\//))) return '/check/' + m[1];
  if (/^\/check\/g[12]$/.test(p)) return '/today';
  return '/today';
}
const appEl = document.getElementById('app');
let stack = [], lastPath = '';
function curPath() { const h = location.hash.slice(1); return h || (S.onb ? '/today' : '/onb/1'); }
function go(p) { if (curPath() === p && location.hash) render(); else location.hash = p; }
function render() {
  const p = curPath();
  let view = null;
  for (const [re, fn] of ROUTES) { const m = p.match(re); if (m) { view = fn(...m.slice(1)); break; } }
  if (!view) view = vToday();
  document.documentElement.lang = S.lang === 'az' ? 'az' : 'ru';
  document.title = (S.lang === 'az' ? 'Urokum — demo' : 'Урокум — демо');
  document.getElementById('hdrTitle').textContent = view.title;
  document.getElementById('demoPill').textContent = t('demo');
  document.getElementById('backBtn').setAttribute('aria-label', t('back'));
  document.getElementById('langRu').classList.toggle('on', S.lang === 'ru');
  document.getElementById('langAz').classList.toggle('on', S.lang === 'az');
  ['Today', 'Toc', 'Pack', 'Check', 'Create'].forEach(k => document.getElementById('nav' + k).textContent = t('nav_' + k.toLowerCase()));
  document.querySelectorAll('.nav [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === view.tab));
  document.getElementById('nav').classList.toggle('hidden', !!view.noNav);
  appEl.classList.toggle('no-nav', !!view.noNav);
  appEl.innerHTML = view.html;
  if (p !== lastPath) { window.scrollTo(0, 0); lastPath = p; }
  if (view.mount) view.mount();
  if (BOARD) boardRefreshLive();
}
window.addEventListener('hashchange', () => {
  if (BOARD) closeBoard();
  crSaveEdits();
  if (CR.edit) CR.edit = false;
  const p = curPath();
  if (p !== '/create/result') crStopGen();
  if (stack.length > 1 && stack[stack.length - 2] === p) stack.pop();
  else if (stack[stack.length - 1] !== p) stack.push(p);
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  render();
});

/* ---------- действия ---------- */
function toast(msg) {
  const L = document.getElementById('layer');
  L.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.tm);
  toast.tm = setTimeout(() => { L.innerHTML = ''; }, 3200);
}
function modal(msg) {
  document.getElementById('layer').innerHTML = `<div class="modal" data-act="closeModal"><div class="box" role="dialog">
    <div class="row" style="gap:12px;align-items:flex-start"><span class="ic" style="flex:none;width:44px;height:44px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center">${I.dl}</span>
    <p style="padding-top:8px">${esc(msg)}</p></div><button class="btn pri" style="margin-top:16px" data-act="closeModal">${esc(t('ok'))}</button></div></div>`;
}
const ACT = {
  back() {
    const p = curPath();
    if (stack.length > 1) history.back();
    else { const par = parentOf(p); stack = [par]; location.replace('#' + par); }
  },
  lang(el) { crSaveEdits(); S.lang = el.dataset.v; save(); render(); },
  print(el) { const [k, a, b] = el.dataset.v.split(':'); doPrint(k, a, b); },
  board(el) { const [k, a, b] = el.dataset.v.split(':'); openBoard(BOARDS[k](a, b)); },
  bExit() { closeBoard(); },
  bPrev() { if (BOARD) boardShow(BOARD.i - 1); },
  bNext() { if (BOARD) boardShow(BOARD.i + 1); },
  bPick(el) {
    const it = el.closest('.b-item');
    it.querySelectorAll('[data-act="bPick"]').forEach(b => b.classList.remove('sel', 'ok', 'bad'));
    el.classList.add('sel');
    if (it.dataset.mode === 'quiz') return;
    const ok = el.dataset.ok === '1';
    el.classList.add(ok ? 'ok' : 'bad');
    it.classList.toggle('done-ok', ok);
    it.classList.toggle('done-bad', !ok);
    const bl = it.querySelector('.b-blank');
    if (bl && el.dataset.fill) bl.textContent = el.dataset.fill;
    if (it.dataset.showAns === '1') it.classList.add('revealed');
  },
  bReveal(el) { el.closest('.b-item').classList.add('revealed'); boardFit(); },
  bBub(el) {
    const row = el.closest('.b-brow'), on = el.classList.contains('on');
    row.querySelectorAll('.b-bub').forEach(b => b.classList.remove('on'));
    if (!on) el.classList.add('on');
  },
  bTry(el) {
    const gs = el.closest('.b-page').querySelectorAll('.try-g');
    const all = [...gs].every(g => g.classList.contains('on'));
    gs.forEach(g => g.classList.toggle('on', !all));
  },
  crGrade(el) { CR.grade = +el.dataset.v; render(); },
  crTpl(el) { CR.tpl = el.dataset.v; render(); },
  crPreset(el) {
    const P = C.create.presets.find(p => p.id === el.dataset.v);
    CR.topic = P.topic; CR.grade = P.grade; CR.text = ''; render();
  },
  crGo() {
    const topic = CR.topic.trim();
    if (!topic) {
      document.getElementById('crErr').classList.remove('hidden');
      document.getElementById('crTopic').focus();
      return;
    }
    const P = findPreset(topic);
    CR.made = {grade: CR.grade, topic, text: CR.text, tpl: CR.tpl, preset: P ? P.id : null};
    CR.edits = {}; CR.edit = false;
    crStopGen();
    const steps = ['cr_s1', 'cr_s2', 'cr_s3', 'cr_s4'];
    document.body.insertAdjacentHTML('beforeend', `<div class="gen" id="crGen" role="status"><div class="owl-b">${owlSvg(120)}</div>
      <div class="h2" style="margin-top:12px">${esc(t('cr_making'))}</div><div class="muted small">«${esc(topic)}» · ${esc(tplName(C.create.templates.find(x => x.id === CR.tpl)))}</div>
      <ul>${steps.map((k, i) => `<li id="gs${i}"><i></i>${esc(t(k))}</li>`).join('')}</ul><div class="bar"><i></i></div></div>`);
    steps.forEach((_, i) => genT.push(setTimeout(() => {
      const li = document.getElementById('gs' + i); if (li) li.classList.add('on');
      const pr = document.getElementById('gs' + (i - 1)); if (pr) { pr.classList.add('done'); pr.querySelector('i').innerHTML = I.check; }
    }, i * 620)));
    genT.push(setTimeout(() => {
      const last = document.getElementById('gs3'); if (last) { last.classList.add('done'); last.querySelector('i').innerHTML = I.check; }
    }, 2450));
    genT.push(setTimeout(() => { genT = []; go('/create/result'); const g = document.getElementById('crGen'); if (g) g.remove(); }, 2650));
  },
  crSwitch(el) { crSaveEdits(); CR.edit = false; CR.made.tpl = el.dataset.v; CR.tpl = el.dataset.v; render(); },
  crEdit() {
    if (CR.edit) { crSaveEdits(); CR.edit = false; render(); toast(t('cr_saved')); }
    else { CR.edit = true; render(); }
  },
  crDl(el) { crSaveEdits(); modal(t('cr_dl_toast', {f: el.dataset.v})); },
  sector(el) { S.sector = el.dataset.v; S.lang = el.dataset.v; save(); render(); },
  grade(el) { S.grade = +el.dataset.v; save(); render(); },
  subj(el) { const v = el.dataset.v; S.subjects = S.subjects.includes(v) ? S.subjects.filter(x => x !== v) : S.subjects.concat(v); save(); render(); },
  finishOnb() { S.onb = true; save(); go('/today'); },
  lessons(el) { S.lessons = +el.dataset.v; save(); render(); },
  topicDone() {
    const cur = currentItems();
    cur.forEach(i => { if (!S.done.includes(i.id)) S.done.push(i.id); });
    save();
    const nx = currentItems()[0];
    render();
    if (nx) toast(t('toast_done', {t: topicLabel(nx)}));
  },
  undoDone() { S.done = ITEMS.slice(0, L10_IDX).map(i => i.id); save(); render(); },
  reset() {
    const lang = S.lang;
    Object.assign(S, JSON.parse(JSON.stringify(DEF)), {lang});
    S.done = ITEMS.slice(0, L10_IDX).map(i => i.id);
    G = null; wsShow = false; cardsKey = false; revShow = false; slideIdx = 0; openRow = '';
    save(); stack = []; location.hash = '/onb/1';
  },
  acc(el) { document.getElementById(el.dataset.v).classList.toggle('open'); },
  slide(el) { const tr = document.getElementById('track'); tr.scrollBy({left: +el.dataset.v * tr.clientWidth, behavior: 'smooth'}); },
  reveal(el) { el.classList.toggle('on'); },
  revealAll() {
    const sl = document.querySelectorAll('#track .slide')[slideIdx];
    const gs = sl ? sl.querySelectorAll('.try-g') : [];
    const allOn = [...gs].every(g => g.classList.contains('on'));
    gs.forEach(g => g.classList.toggle('on', !allOn));
  },
  wsTab(el) { wsTab = el.dataset.v; render(); },
  wsShow() { wsShow = !wsShow; render(); },
  groups(el) { groupsN = +el.dataset.v; render(); },
  cardsKey() { cardsKey = !cardsKey; render(); },
  revShow() { revShow = !revShow; render(); },
  gameStart() { newGame(); render(); },
  gameAns(el) {
    if (!G || G.picked != null) return;
    const k = +el.dataset.v, q = C.lesson.quiz[G.i];
    G.picked = k;
    const ok = k === q.a;
    G.log.push(ok);
    if (ok) { G.ok++; G.score += C.lesson.quiz_points[G.i]; }
    render();
  },
  game5050() {
    if (!G || G.used5050) return;
    const q = C.lesson.quiz[G.i];
    const wrong = q.opts.map((_, k) => k).filter(k => k !== q.a);
    wrong.sort(() => Math.random() - .5);
    G.gone = wrong.slice(0, 2); G.used5050 = true; render();
  },
  gameHint() { if (!G || G.usedHint) return; G.hint = true; G.usedHint = true; render(); },
  gameNext() {
    if (G.i + 1 >= C.lesson.quiz.length) G.state = 'end';
    else { G.i++; G.picked = null; G.gone = []; G.hint = false; }
    render();
  },
  checkGrade(el) {
    S.checkGrade = el.dataset.v; save();
    const np = curPath().replace(/g[12]/, el.dataset.v).replace(/^\/check$/, '/check/' + el.dataset.v);
    stack[stack.length - 1] = np;
    location.replace('#' + np);
  },
  scan(el) {
    const g = el.dataset.v, n = C.students.length;
    const box = document.getElementById('scanBox');
    el.disabled = true;
    box.insertAdjacentHTML('beforeend', `<div class="line"></div><div class="cnt" id="scanCnt">${esc(t('scanning'))}</div>`);
    let i = 0;
    scanTimer = setInterval(() => {
      i++;
      const c = document.getElementById('scanCnt');
      if (c) c.textContent = t('checked', {i, n});
      if (i >= n) { clearInterval(scanTimer); scanTimer = null; setTimeout(() => { S.scanned[g] = true; save(); render(); }, 350); }
    }, 110);
  },
  rescan(el) { S.scanned[el.dataset.v] = false; openRow = ''; save(); render(); },
  row(el) {
    const key = el.dataset.v;
    const d = document.getElementById('det' + key.split(':')[1]);
    const was = openRow === key;
    document.querySelectorAll('.det.open').forEach(x => x.classList.remove('open'));
    openRow = was ? '' : key;
    if (!was && d) d.classList.add('open');
  },
  dl() { modal(t('dl_toast')); },
  dlLink() { modal(t('dl_link_toast')); },
  closeModal(el, e) { if (e.target === el || el.tagName === 'BUTTON') document.getElementById('layer').innerHTML = ''; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.go) { e.preventDefault(); go(el.dataset.go); return; }
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (BOARD) {
    const nextK = ['ArrowRight', 'PageDown', ' '].includes(e.key), prevK = ['ArrowLeft', 'PageUp'].includes(e.key);
    if (e.key === 'Escape') { e.preventDefault(); closeBoard(); return; }
    if (nextK || prevK) e.preventDefault();
    if (BOARD.m === 'game') { if (nextK && G && G.state !== 'end' && G.picked != null) ACT.gameNext(); return; }
    if (nextK) boardShow(BOARD.i + 1);
    else if (prevK) boardShow(BOARD.i - 1);
    return;
  }
  if (!document.getElementById('track')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const tr = document.getElementById('track');
    tr.scrollBy({left: (e.key === 'ArrowRight' ? 1 : -1) * tr.clientWidth, behavior: 'smooth'});
  }
});

/* ---------- старт ---------- */
if (!location.hash) history.replaceState(null, '', '#' + curPath());
stack = [curPath()];
render();
</script>
