<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Урокум — готовые материалы к каждому уроку. Демо-прототип для учителя начальных классов.">
<title>Урокум — демо</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EУ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1b2333; --muted:#5a6476; --line:#e2e6ef;
  --pri:#2f6fed; --pri-d:#1f56c8; --pri-soft:#e9f0ff; --acc:#f5a524; --acc-soft:#fff4dc;
  --ok:#1f9d55; --ok-soft:#e2f6ea; --bad:#d64545; --bad-soft:#fdeaea;
  --red:#e5484d; --blue:#3b82f6; --green:#22a06b; --orange:#f08c2e; --purple:#8e5cd9; --teal:#0f9b9b; --yellow:#f2b705;
  --r:16px; --nav-h:64px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto}

/* ---------- шапка ---------- */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px)}
.hdr .wrap{display:flex;align-items:center;gap:6px;height:56px;padding:0 8px}
.icon-btn{width:44px;height:44px;min-width:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:var(--pri-soft)}
.icon-btn svg{width:26px;height:26px}
.hdr-title{flex:1;min-width:0;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-demo{flex:none;background:var(--acc-soft);color:#8a5a00;border:1px solid #f3d38c;font-size:13px;font-weight:700;
  padding:3px 8px;border-radius:999px}
.lang{flex:none;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lang button{border:0;background:#fff;min-width:44px;min-height:44px;font-size:15px;font-weight:700;color:var(--muted);padding:0 6px}
.lang button.on{background:var(--pri);color:#fff}

/* ---------- контент ---------- */
main{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
main.no-nav{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-wrap:anywhere}
.card.tight{padding:12px}
.muted{color:var(--muted)}
.small{font-size:15px}
.xs{font-size:13px}
.h1{font-size:24px;font-weight:800;line-height:1.2}
.h2{font-size:20px;font-weight:800;line-height:1.25}
.h3{font-size:17px;font-weight:700}
.eyebrow{font-size:14px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between;flex-wrap:wrap}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.note{background:var(--acc-soft);border:1px solid #f3d38c;border-radius:12px;padding:12px;font-size:15px}
.note.blue{background:var(--pri-soft);border-color:#c9d8ff}
.sep{height:1px;background:var(--line);margin:12px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;
  border:1px solid var(--line);background:#fff;font-weight:700;font-size:17px;padding:10px 16px;text-align:center}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:active{background:var(--pri-d)}
.btn.ok{background:var(--ok-soft);border-color:#b7e4c7;color:#126b3a}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:8px 14px}
.btn svg{width:22px;height:22px;flex:none}
.link-btn{border:0;background:none;color:var(--pri);font-weight:700;min-height:44px;padding:0 4px}

.seg{display:flex;background:#eceff6;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:11px;min-height:44px;font-weight:700;font-size:16px;color:var(--muted);padding:6px 8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.15)}
.seg.wrap2 button{font-size:14px;line-height:1.2}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--pri-soft);color:var(--pri-d);
  font-weight:700;font-size:14px;padding:4px 10px}
.chip.gray{background:#eef0f5;color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:#126b3a}

.std{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.std:first-child{border-top:0;padding-top:4px}
.std .code{flex:none;font-weight:800;color:var(--pri-d);background:var(--pri-soft);border-radius:8px;padding:2px 8px;font-size:14px;margin-top:2px}
.std .txt{font-size:15px}

/* ---------- плитки ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:118px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.tile:active{background:var(--pri-soft)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-size:13px;color:var(--muted);line-height:1.25}
.tile .letter{font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}

/* ---------- нижнее меню ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 1px;min-width:0;letter-spacing:-.01em}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--pri)}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- онбординг ---------- */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:6px;border-radius:3px;background:#dfe3ec}
.steps i.on{background:var(--pri)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--r);
  padding:14px;min-height:72px}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt .big{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:22px;background:#eef2fb;color:var(--pri-d)}
.opt.on .big{background:var(--pri);color:#fff}
.opt b{display:block;font-size:18px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grades .opt{flex-direction:column;justify-content:center;text-align:center;min-height:96px}
.subjects{display:flex;flex-wrap:wrap;gap:8px}
.subjects button{min-height:48px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px}
.subjects button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:52px;height:52px;border-radius:16px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900;font-size:28px}

/* ---------- сегодня ---------- */
.lesson-card{border:2px solid var(--pri);}
.topic-title{font-size:23px;font-weight:800;line-height:1.2}
.pages{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:15px;color:var(--muted)}
.progress{height:10px;border-radius:5px;background:#e6e9f1;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:5px}

/* ---------- содержание ---------- */
.part-h{font-weight:800;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin:20px 4px 8px}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec+.sec{margin-top:10px}
.sec-h{padding:12px 14px;font-weight:800;background:#f8f9fc;border-bottom:1px solid var(--line);font-size:16px}
.trow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:#fff;text-align:left;min-height:52px;padding:8px 12px}
.trow:first-of-type{border-top:0}
.trow:active{background:var(--pri-soft)}
.trow .st{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid #cfd5e2}
.trow .st svg{width:16px;height:16px}
.trow.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.trow.done .tt{color:var(--muted)}
.trow.today{background:#f0f5ff}
.trow.today .st{border-color:var(--pri);background:var(--pri)}
.trow.today .st::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.trow .tt{flex:1;min-width:0;font-size:16px}
.trow .pg{flex:none;font-size:14px;color:var(--muted)}
.trow .chev{flex:none;width:18px;height:18px;color:#a3abbd}

/* ---------- план ---------- */
.field{padding:12px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:0}
.field .k{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:4px}
.field ul,.steps-list{margin:0;padding-left:20px}
.field li,.steps-list li{margin:4px 0}
.timebar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 4px}
.timebar i{display:block;height:100%}
.acc{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.acc+.acc{margin-top:8px}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;text-align:left;min-height:56px;padding:10px 12px}
.acc-h .n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.acc-h .nm{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.25}
.acc-h .mn{flex:none;font-weight:800;font-size:14px;background:#eef0f5;border-radius:999px;padding:3px 9px}
.acc-h .chev{width:20px;height:20px;flex:none;transition:transform .2s;color:#8b94a7}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-b{display:none;padding:0 14px 14px 52px;font-size:16px}
.acc.open .acc-b{display:block}
.acc-b .form{font-size:14px;color:var(--muted);margin-bottom:4px}
.crit{padding:12px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0;padding-top:0}
.crit ol{margin:6px 0 0;padding-left:0;list-style:none;font-size:15px}
.crit li{display:flex;gap:8px;margin:4px 0}
.crit li b{flex:none;width:30px;color:var(--pri-d)}

/* ---------- слайды ---------- */
.slides{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r);-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slide svg{display:block;width:100%;height:100%}
.slide-ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.slide-ctrl .icon-btn{background:#fff;border:1px solid var(--line);width:52px;height:52px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:#cdd3e0}
.dots i.on{background:var(--pri);width:20px;border-radius:4px}
.try-g{cursor:pointer}
.try-g .s{opacity:0;transition:opacity .2s}
.try-g.on .s{opacity:1}
.try-g.on .q{opacity:0}

/* ---------- листы ---------- */
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.task{padding:14px 0;border-top:1px dashed #d6dbe6}
.task:first-of-type{border-top:0}
.task-q{display:flex;gap:10px;align-items:flex-start}
.task-q .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.task-q .qt{flex:1;min-width:0;font-weight:700}
.items{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0 0 40px}
.item{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;min-height:44px;flex-wrap:wrap}
.item.text{font-size:17px;font-weight:600;width:100%}
.blank{display:inline-grid;place-items:center;min-width:38px;height:38px;border:2px dashed #9aa4b8;border-radius:50%;padding:0 6px;font-weight:800;color:var(--ok)}
.blank.box{border-radius:8px}
.blank .fill{visibility:hidden}
.circ{display:inline-grid;place-items:center;min-width:42px;height:42px;border-radius:50%;border:2px solid transparent;padding:0 4px}
.item.pair{background:#f3f5fa;border:1px solid var(--line);border-radius:14px;padding:2px 8px;gap:4px}
.show-ans .circ.yes{border-color:var(--ok);background:var(--ok-soft);color:#126b3a}
.show-ans .blank{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.show-ans .blank .fill{visibility:visible}
.ans{display:none;color:#126b3a;background:var(--ok-soft);border-radius:10px;padding:6px 10px;font-size:15px;font-weight:700;margin-top:6px;width:100%}
.ans .nt{font-weight:500;color:#2c6e47}
.show-ans .ans{display:block}
.pic{display:inline-flex;align-items:center;max-width:100%}
.pic svg{max-width:100%;height:auto}

/* ---------- карточки групп ---------- */
.gcard{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
.gcard+.gcard{margin-top:12px}
.gcard .gh{color:#fff;padding:10px 14px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.gcard .gb{padding:14px}

/* ---------- инфографика ---------- */
.poster{background:linear-gradient(180deg,#fff, #f6f9ff);border:2px solid var(--pri);border-radius:20px;padding:16px}
.istep{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:2px dashed #cfdaf5}
.istep:first-of-type{border-top:0}
.istep .bn{flex:none;width:44px;height:44px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.istep .bd{flex:1;min-width:0}
.istep .pic{margin-top:8px}
.signs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.signs3 div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.signs3 b{display:block;font-size:30px;line-height:1.1}

/* ---------- игра ---------- */
.game{background:linear-gradient(170deg,#1d2a6b,#3a2a85);color:#fff;border-radius:20px;padding:16px;min-height:420px}
.game .muted{color:#c8cdf2}
.ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0 14px}
.ladder i{height:10px;border-radius:5px;background:rgba(255,255,255,.22)}
.ladder i.ok{background:#41d686}
.ladder i.bad{background:#ff6b6b}
.ladder i.cur{background:#ffd34d}
.gq{font-size:21px;font-weight:800;line-height:1.3;margin:6px 0 10px}
.gpic{background:#fff;border-radius:14px;padding:8px;display:flex;justify-content:center;margin-bottom:12px}
.gopts{display:grid;gap:10px}
.gopt{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:16px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
  color:#fff;text-align:left;padding:8px 14px;font-size:20px;font-weight:700}
.gopt .lt{flex:none;width:32px;height:32px;border-radius:50%;background:#ffd34d;color:#1d2a6b;display:grid;place-items:center;font-size:16px;font-weight:900}
.gopt.ok{background:#1f9d55;border-color:#41d686}
.gopt.bad{background:#c73b3b;border-color:#ff8a8a}
.gopt.gone{visibility:hidden}
.gopt:disabled{cursor:default}
.lifes{display:flex;gap:10px;margin-top:14px}
.life{flex:1;min-height:48px;border-radius:14px;border:2px solid #ffd34d;background:transparent;color:#ffd34d;font-weight:800;font-size:16px}
.life:disabled{opacity:.35}
.ghint{background:rgba(255,211,77,.15);border:1px solid rgba(255,211,77,.5);border-radius:12px;padding:10px;margin-top:12px;font-size:16px}
.gfb{margin-top:12px;font-weight:800;font-size:18px}
.btn.yellow{background:#ffd34d;border-color:#ffd34d;color:#1d2a6b}
.score-big{font-size:46px;font-weight:900;line-height:1;margin:10px 0 4px;color:#ffd34d}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- проверка ---------- */
.opts3{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0 40px;font-size:17px}
.opts3 span b{color:var(--muted)}
.opts3 span.right{color:#126b3a;font-weight:800}
.crit-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:12px 0 4px;border-top:2px solid var(--line);margin-top:6px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.keygrid div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:14px;color:var(--muted)}
.keygrid b{display:block;font-size:22px;color:#126b3a}
.paper{background:#fff;border:1px solid #cfd5e2;border-radius:6px;box-shadow:0 2px 10px rgba(20,30,60,.08);padding:14px}
.paper-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.paper-top .qr{flex:none;width:96px;height:96px}
.paper-top .qr svg{width:100%;height:100%;display:block}
.fill-line{border-bottom:1px solid #9aa4b8;min-height:30px;font-size:14px;color:var(--muted);display:flex;align-items:flex-end;padding-bottom:2px}
.bubbles{display:grid;grid-template-columns:1fr;gap:6px 18px;margin-top:12px}
.bubbles.two{grid-template-columns:1fr 1fr;grid-auto-flow:column}
.brow{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.brow .bn{width:24px;text-align:right;flex:none}
.brow i{width:28px;height:28px;border:2px solid #556;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#556}
.scan-box{position:relative;border-radius:18px;overflow:hidden;background:#1b2333;aspect-ratio:3/4;max-height:380px;margin:0 auto;width:100%}
.scan-box .sheet{position:absolute;inset:12% 16%;background:#fff;border-radius:6px;transform:rotate(-3deg)}
.scan-box .sheet::before{content:"";position:absolute;inset:10% 10% auto 10%;height:60%;background:repeating-linear-gradient(180deg,#e3e7ef 0 6px,transparent 6px 18px)}
.scan-box .qrm{position:absolute;right:8%;top:5%;width:22%;aspect-ratio:1;background:#1b2333;border-radius:2px}
.scan-box .frame{position:absolute;inset:8% 10%;border:3px solid rgba(255,255,255,.85);border-radius:14px}
.scan-box .line{position:absolute;left:10%;right:10%;height:3px;background:#41d686;box-shadow:0 0 12px #41d686;top:10%;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
.scan-box .cnt{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-weight:800}
.bar{height:12px;border-radius:6px;background:#e6e9f1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.res{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.res-h,.res-r{display:grid;grid-template-columns:30px 1fr 74px 96px;gap:6px;align-items:center;padding:8px 10px}
.res-h{background:#f6f7fb;font-size:13px;font-weight:800;color:var(--muted)}
.res-r{width:100%;border:0;border-top:1px solid var(--line);background:#fff;text-align:left;min-height:48px;font-size:15px}
.res-r .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.res-r .num{text-align:center;font-weight:700}
.badge.lvl{white-space:normal;line-height:1.15}
.res.lv .res-h,.res.lv .res-r{grid-template-columns:26px 1fr 52px 112px}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:13px;font-weight:800;text-align:center;white-space:nowrap}
.m5{background:#dcf5e6;color:#0f6b37}.m4{background:#e2ecff;color:#1f4fb3}.m3{background:#fff1d6;color:#8a5a00}.m2{background:#fde2e2;color:#a12a2a}
.lv-green{background:#dcf5e6;color:#0f6b37}.lv-blue{background:#e2ecff;color:#1f4fb3}.lv-orange{background:#fff1d6;color:#8a5a00}.lv-red{background:#fde2e2;color:#a12a2a}
.det{display:none;padding:8px 10px 12px;background:#fafbfd;border-top:1px dashed var(--line);font-size:14px}
.det.open{display:block}
.det .cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0}
.det .cells span{border-radius:6px;text-align:center;padding:3px 0;font-weight:700;font-size:13px}
.det .cells .y{background:var(--ok-soft);color:#126b3a}
.det .cells .n{background:var(--bad-soft);color:#a12a2a}
.dist{display:grid;grid-template-columns:auto 1fr 28px;gap:8px 10px;align-items:center;font-size:15px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#f6f8fc;border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:#eef0f5;border-radius:999px;padding:4px 10px;font-size:14px}

/* ---------- скачать ---------- */
.dl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.dl-row:first-child{border-top:0;padding-top:0}
.dl-row .nm{flex:1 1 160px;min-width:0;font-weight:700}
.dl-row .fm{display:flex;gap:6px;flex-wrap:wrap}
.fmt{min-height:44px;min-width:64px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px;padding:6px 10px}
.fmt.word{color:#1f56c8}.fmt.pdf{color:#c0392b}.fmt.ppt{color:#c55a11}.fmt.png{color:#0f8a5f}.fmt.link{color:#6b3fc1}

/* ---------- создать ---------- */
.lbl{display:block;font-size:15px;font-weight:800;color:var(--muted);margin:16px 0 6px}
.lbl.first{margin-top:0}
.inp{display:block;width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--pri)}
textarea.inp{min-height:118px;resize:vertical;line-height:1.4}
.chip-btn{min-height:44px;border:2px solid #c9d8ff;background:var(--pri-soft);color:var(--pri-d);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.chip-btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;min-height:104px;min-width:0}
.tpl.on{border-color:var(--pri);background:var(--pri-soft)}
.tpl b{font-size:15px;line-height:1.2}
.tpl span{font-size:12.5px;color:var(--muted);line-height:1.25}
.tpl .mini{width:100%;max-width:120px;height:34px;display:block}
.tpl:last-child:nth-child(odd){grid-column:1 / -1}
.cr-hero,.cr-tile{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff4dc,#ffe3ec);border:1px solid #f6d5b0}
.cr-tile{width:100%;text-align:left;border-radius:var(--r);padding:12px 14px;min-height:88px}
.cr-tile b{display:block;font-size:18px;color:var(--ink)}
.cr-tile span{font-size:14px;color:var(--muted)}
.cr-tile .chev{margin-left:auto;width:22px;height:22px;flex:none;color:#b07a2a}
.gen{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#eef4ff,#fff6e6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gen .owl-b{animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(-4deg)}}
.gen ul{list-style:none;padding:0;margin:16px 0 0;text-align:left;width:100%;max-width:300px}
.gen li{display:flex;gap:10px;align-items:center;padding:6px 0;font-weight:700;color:#9aa4b8;transition:color .2s}
.gen li i{width:24px;height:24px;border-radius:50%;border:2px solid #cfd5e2;display:grid;place-items:center;flex:none;font-style:normal}
.gen li.on{color:var(--ink)}
.gen li.on i{border-color:var(--pri)}
.gen li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.gen li i svg{width:14px;height:14px}
.gen .bar{width:100%;max-width:300px;margin-top:16px}
.gen .bar i{background:var(--pri);width:0;animation:grow 2.6s linear forwards}
@keyframes grow{to{width:100%}}
.sheet{background:#fff;border-radius:18px;border:1px solid var(--line);padding:12px;box-shadow:0 4px 18px rgba(30,40,80,.08);overflow-wrap:break-word}
.sh-head{border-radius:14px;padding:10px 12px;color:#fff;margin-bottom:12px}
.sh-badge{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.sh-title{font-size:22px;font-weight:900;line-height:1.15;margin-top:4px}
.sh-meta{font-size:13px;font-weight:700;opacity:.95;margin-top:2px}
.ed{outline:none;border-radius:6px}
.editing .ed{outline:2px dashed #f5a524;outline-offset:2px;background:rgba(255,244,220,.65);cursor:text}
.sh-head .ed,.sld .ed{background:transparent}
.tq-grid{display:grid;grid-template-columns:1.12fr 1fr;gap:10px;align-items:start}
.tq-text{background:#fffbea;border:2px solid #ffd76a;border-radius:14px;padding:10px;font-size:15px;line-height:1.45}
.tq-text p+p{margin-top:8px}
.tq-side{display:flex;flex-direction:column;gap:26px;padding-top:18px}
.cloud{position:relative;border-radius:22px;padding:8px 8px 8px;color:#fff;background:var(--cc)}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cc);border-radius:50%;z-index:0}
.cloud::before{width:34px;height:34px;top:-14px;left:12px}
.cloud::after{width:44px;height:44px;top:-20px;left:38px}
.cloud>*{position:relative;z-index:1}
.cloud .ch{font-weight:900;font-size:13.5px;line-height:1.15;text-align:center;margin-bottom:6px}
.cloud ol{margin:0;padding:6px 6px 6px 22px;background:#fff;color:var(--ink);border-radius:12px;font-size:13.5px;line-height:1.3}
.cloud li+li{margin-top:5px}
.cloud .tl{position:absolute;border-radius:50%;background:var(--cc);z-index:0}
.cloud .tl.a{width:12px;height:12px;right:20px;bottom:-15px}
.cloud .tl.b{width:7px;height:7px;right:13px;bottom:-25px}
.c-pink{--cc:#e3427a}.c-blue{--cc:#2b7fd9}.c-green{--cc:#1d8f4f}
.tq-owl{display:flex;justify-content:center;margin-top:-4px}
.clu{position:relative;width:100%;aspect-ratio:1/1.1}
.clu svg.lines{position:absolute;inset:0;width:100%;height:100%}
.clu .nd{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:36%;text-align:center;font-weight:800;font-size:12.5px;line-height:1.2;color:#fff;border-radius:14px;padding:6px 7px;overflow-wrap:break-word;word-break:normal}
.clu .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32%;aspect-ratio:1;border-radius:50%;background:#ffd34d;color:#5a3b00;display:grid;place-items:center;text-align:center;font-weight:900;font-size:15px;line-height:1.15;padding:6px;box-shadow:0 0 0 6px #fff3c4;overflow-wrap:break-word}
.clu .ctr.sm{font-size:13px}
.clu .ctr.xs2{font-size:11.5px}
.pst-rule{background:#fff4dc;border:3px solid #ffb020;border-radius:16px;padding:12px;font-size:18px;font-weight:800;line-height:1.35;color:#5a3b00}
.pst-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.pst-ex div{border-radius:14px;padding:8px 6px;text-align:center;color:#fff;font-weight:800;min-width:0}
.pst-ex b{display:block;font-size:20px;line-height:1.2}
.pst-ex b mark{background:#fff;color:inherit;border-radius:4px;padding:0 2px;color:#1b2333}
.pst-ex span{display:block;font-size:12.5px;font-weight:700;opacity:.95}
.pst-row{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.pst-row .say{flex:1;min-width:0;background:#e9f0ff;border-radius:16px 16px 4px 16px;padding:10px;font-weight:700;font-size:15px;color:#1f3f8f}
.gc{border-radius:16px;overflow:hidden;border:2px solid var(--cc)}
.gc+.gc{margin-top:10px}
.gc .gch{background:var(--cc);color:#fff;font-weight:900;padding:8px 12px;display:flex;align-items:center;gap:8px}
.gc .gch i{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--cc);display:grid;place-items:center;font-style:normal;font-weight:900;flex:none}
.gc .gcb{padding:10px 12px;font-size:16px}
.gc .gca{font-size:13.5px;color:var(--muted);margin-top:6px}
.sld{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#2f6fed,#7c4dff);color:#fff;padding:12px 10px 10px 14px;display:flex;gap:4px}
.sld .sb{flex:1;min-width:0}
.sld .st{font-size:19px;font-weight:900;line-height:1.15;margin-bottom:6px}
.sld ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.3}
.sld li+li{margin-top:3px}
.sld .so{flex:none;align-self:flex-end}
.cr-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cr-acts .wide{grid-column:1 / -1}

/* ---------- кнопки материала ---------- */
.mat-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- печать ---------- */
#print{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff !important}
  body>*:not(#print){display:none !important}
  #print{display:block !important}
}
#print{color:#000;font:11pt/1.35 Arial,"Helvetica Neue",Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print *{color:#000 !important;box-shadow:none !important;text-shadow:none !important}
#print svg{max-width:100%}
.pr-page{break-after:page;page-break-after:always}
.pr-page:last-child{break-after:auto;page-break-after:auto}
.pr-head{display:flex;justify-content:space-between;gap:10pt;border-bottom:1.2pt solid #000;padding-bottom:3pt;margin-bottom:8pt;font-size:8.5pt}
.pr-title{font-size:17pt;font-weight:800;line-height:1.2}
.pr-sub{font-size:10.5pt;margin:2pt 0 6pt}
.pr-name{display:flex;gap:18pt;margin:4pt 0 8pt;font-size:11pt}
.pr-name div{flex:1;display:flex;gap:4pt;align-items:flex-end}
.pr-name i{flex:1;border-bottom:1pt solid #000;height:14pt}
.pr-task{break-inside:avoid;page-break-inside:avoid;padding:6pt 0;border-top:0.6pt dashed #888}
.pr-task.first{border-top:0}
.pr-q{display:flex;gap:6pt;font-weight:700;align-items:flex-start}
.pr-n{flex:none;width:17pt;height:17pt;border:1.2pt solid #000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9.5pt}
.pr-std{font-weight:400;font-size:8pt;border:0.6pt solid #555;border-radius:6pt;padding:0 4pt;margin-left:5pt;white-space:nowrap}
.pr-items{display:flex;flex-wrap:wrap;gap:6pt 26pt;margin:6pt 0 0 23pt;align-items:center}
.pr-item{display:inline-flex;align-items:center;gap:6pt;font-size:16pt;font-weight:700}
.pr-item.text{display:block;width:100%;font-size:11.5pt;font-weight:400}
.pr-blank{display:inline-block;width:22pt;height:22pt;border:1.2pt solid #000;border-radius:50%;vertical-align:middle}
.pr-blank.box{border-radius:3pt}
.pr-blank.sm{width:15pt;height:15pt}
.pr-line{border-bottom:0.8pt solid #000;height:20pt}
.pr-draw{border:0.8pt solid #000;height:26mm;margin-top:4pt}
.pr-legend{display:block;font-size:8.5pt;font-weight:400;margin-top:2pt}
.pr-and{font-weight:400;font-size:12pt}
.pr-h3{font-size:12.5pt;font-weight:800;margin:10pt 0 4pt}
.pr-keylist{margin:0;padding-left:18pt}
.pr-keylist li{margin:2pt 0}
.pr-pic{margin-top:3pt}
table.pr-tab{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4pt 0 8pt}
.pr-tab th,.pr-tab td{border:0.8pt solid #000;padding:3pt 5pt;vertical-align:top;text-align:left}
.pr-tab th{font-weight:800}
.pr-tab ul{margin:0;padding-left:12pt}
.pr-tab tr{break-inside:avoid;page-break-inside:avoid}
.pr-tab.crit td{font-size:8.5pt}
.pr-cut{display:flex;align-items:center;gap:6pt;font-size:9.5pt;margin-bottom:5pt}
.pr-cut svg{width:15pt;height:15pt}
.pr-cards{display:grid;grid-template-columns:1fr 1fr;border-top:1.4pt dashed #000;border-left:1.4pt dashed #000}
.pr-card{border-right:1.4pt dashed #000;border-bottom:1.4pt dashed #000;padding:10pt;min-height:76mm;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;gap:7pt}
.pr-card-h{font-size:13pt;font-weight:800;border-bottom:1pt solid #000;padding-bottom:3pt}
.pr-card-q{font-size:13pt;line-height:1.4}
.pr-card .pr-std{align-self:flex-start;margin:auto 0 0}
.pr-sheet-top{display:flex;justify-content:space-between;gap:12pt;align-items:flex-start}
.pr-qr{flex:none;width:38mm;height:38mm}
.pr-qr svg{width:100%;height:100%;display:block}
.pr-fill{display:flex;gap:4pt;align-items:flex-end;margin-top:9pt;font-size:11pt}
.pr-fill i{flex:1;border-bottom:1pt solid #000;height:14pt;min-width:60mm}
.pr-bubbles{display:grid;grid-template-columns:1fr;gap:7pt 30pt;margin-top:14pt}
.pr-bubbles.two{grid-template-columns:1fr 1fr;grid-auto-flow:column}
.pr-brow{display:flex;align-items:center;gap:8pt;font-size:12pt;font-weight:700}
.pr-brow b{width:18pt;text-align:right}
.pr-brow i{width:22pt;height:22pt;border:1.2pt solid #000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10pt;font-weight:400}
.pr-slide{break-inside:avoid;page-break-inside:avoid;margin-bottom:9pt}
.pr-slide-svg{border:1pt solid #000}
.pr-slide-svg svg{display:block;width:100%;height:auto}
.pr-note{font-size:9.5pt;margin-top:3pt}
.pr-opts{display:grid;grid-template-columns:1fr 1fr;gap:2pt 16pt;margin:4pt 0 0 23pt;font-size:11pt}
.pr-opts.three{grid-template-columns:1fr 1fr 1fr}
.pr-info-top{display:flex;gap:12pt;align-items:center}
.pr-info-step{display:flex;gap:10pt;align-items:flex-start;padding:7pt 0;border-top:0.8pt dashed #888;break-inside:avoid}
.pr-info-step .pr-n{width:24pt;height:24pt;font-size:13pt}
.pr-signs{display:flex;gap:10pt;margin:4pt 0}
.pr-signs div{flex:1;border:1pt solid #000;border-radius:6pt;text-align:center;padding:4pt}
.pr-signs b{display:block;font-size:20pt}
.pr-read{font-size:12pt;margin:2pt 0}
.pr-read b{font-size:15pt;display:inline-block;min-width:52pt}
.pr-ans-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3pt;font-size:10pt;margin:4pt 0 8pt}
.pr-ans-grid div{border:0.8pt solid #000;text-align:center;padding:2pt}

/* ---------- на доску ---------- */
html.board-open,html.board-open body{overflow:hidden}
.board{position:fixed;inset:0;z-index:100;background:#fff;color:#1b2333;display:flex;flex-direction:column;
  font-size:clamp(22px,min(4vw,6.4vh),60px);line-height:1.25;user-select:none;-webkit-user-select:none}
.board .hidden{display:none !important}
.board button{font:inherit;min-width:80px;min-height:80px;border-radius:22px;cursor:pointer;color:inherit;touch-action:manipulation}
.b-top,.b-bot{flex:none;display:flex;align-items:center;gap:16px;padding:10px 16px}
.b-top{border-bottom:3px solid #e2e6ef}
.b-bot{border-top:3px solid #e2e6ef;justify-content:space-between}
.b-title{flex:1;min-width:0;font-weight:800;font-size:max(17px,.62em);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-count{flex:none;font-weight:800;font-size:max(17px,.6em);color:#5a6476}
.b-exit{flex:none;display:flex;align-items:center;gap:10px;border:3px solid #1b2333;background:#fff;font-size:max(17px,.55em) !important;font-weight:800;padding:0 22px}
.b-exit svg,.b-nav svg{width:1.1em;height:1.1em;flex:none}
.b-nav{display:flex;align-items:center;justify-content:center;gap:12px;min-width:max(130px,4.6em) !important;border:3px solid #2f6fed;background:#e9f0ff;color:#1f56c8 !important;font-size:max(17px,.6em) !important;font-weight:800;padding:0 22px}
@media (max-width:600px){.b-dots{display:none !important}.b-top,.b-bot{gap:8px;padding:8px 10px}.b-exit,.b-nav{padding:0 12px !important}}
.b-nav:disabled{opacity:.3;cursor:default}
.b-dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-width:0}
.b-dots i{width:14px;height:14px;border-radius:50%;background:#cdd3e0}
.b-dots i.on{background:#2f6fed}
.b-stage{flex:1;min-height:0;overflow:auto;display:flex;padding:12px 24px}
.b-page{width:100%;max-width:1700px;max-height:100%;margin:auto}
.board .small,.board .xs{font-size:.6em}
.board .h1{font-size:1.1em}
.board .h2{font-size:.9em}
.b-task-q{display:flex;gap:.4em;align-items:flex-start;font-weight:800;font-size:.85em;margin-bottom:.5em}
.b-n{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:#1b2333;color:#fff;display:grid;place-items:center;font-size:max(17px,.8em)}
.b-items{display:flex;flex-wrap:wrap;gap:.4em .6em;justify-content:center}
.b-item{display:flex;flex-direction:column;align-items:center;gap:.3em;border:4px solid #e2e6ef;border-radius:28px;padding:.3em .5em;transition:background .2s,border-color .2s}
.b-item.done-ok{border-color:#1f9d55;background:#e2f6ea}
.b-item.done-bad{border-color:#d64545;background:#fdeaea}
.b-expr{display:flex;align-items:center;gap:.3em;font-weight:900;font-size:1.2em;flex-wrap:wrap;justify-content:center}
.b-expr.long{font-size:.8em;font-weight:700}
.b-blank{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;border:5px dashed #9aa4b8;border-radius:50%;color:#1b2333}
.b-blank.box{border-radius:14px}
.b-opts{display:flex;gap:.3em;align-items:center;flex-wrap:wrap;justify-content:center}
.b-opts.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7.5em),1fr));gap:.3em;width:100%}
.b-sign,.b-num,.b-yn,.b-opt,.b-bub{border:4px solid #2f6fed;background:#fff;font-weight:900}
.b-sign{width:max(80px,1.7em);height:max(80px,1.7em);font-size:1em}
.b-num{width:max(80px,2em);height:max(80px,2em);border-radius:50% !important;font-size:1.2em}
.b-yn{padding:0 .6em;font-size:.75em}
.b-opt{text-align:left;padding:.15em .6em;font-size:.8em}
.b-and{font-size:.8em;color:#5a6476;font-weight:600}
[data-act="bPick"].sel{background:#2f6fed;color:#fff !important;border-color:#2f6fed}
[data-act="bPick"].sel.ok{background:#1f9d55;border-color:#1f9d55}
[data-act="bPick"].sel.bad{background:#d64545;border-color:#d64545}
.b-item.revealed [data-ok="1"]{background:#1f9d55 !important;border-color:#1f9d55 !important;color:#fff !important}

4","sec":10,"part":2,"pages":"39–40"},{"no":"40","ru":"Гяпик, манат","p":41,"id":"t55","sec":10,"part":2,"pages":"41–42"},{"no":"41","ru":"Покупка-продажа","p":43,"id":"t56","sec":10,"part":2,"pages":"43–44"},{"no":"","ru":"Обобщающие задания","p":45,"id":"t57","sec":10,"part":2,"pages":"45–47"}]},{"no":11,"part":2,"ru":"Измерение","az":"Ölçmə","items":[{"no":"42","ru":"Длинный, короткий","p":48,"id":"t58","sec":11,"part":2,"pages":"48–50"},{"no":"43","ru":"Сантиметр","p":51,"id":"t59","sec":11,"part":2,"pages":"51–52"},{"no":"44","ru":"Тяжёлый, лёгкий","p":53,"id":"t60","sec":11,"part":2,"pages":"53–54"},{"no":"45","ru":"Ёмкость","p":55,"id":"t61","sec":11,"part":2,"pages":"55–56"},{"no":"","ru":"Решите задачи","p":57,"id":"t62","sec":11,"part":2,"pages":"57"},{"no":"46","ru":"День, неделя, месяц","p":58,"id":"t63","sec":11,"part":2,"pages":"58–60"},{"no":"47","ru":"Часы","p":61,"id":"t64","sec":11,"part":2,"pages":"61–62"},{"no":"","ru":"Обобщающие задания","p":63,"id":"t65","sec":11,"part":2,"pages":"63"}]},{"no":12,"part":2,"ru":"Представление информации","az":"Məlumatın təqdimi","end":73,"items":[{"no":"48","ru":"Таблица, пиктограмма","p":64,"id":"t66","sec":12,"part":2,"pages":"64–66"},{"no":"","ru":"Решите задачи","p":67,"id":"t67","sec":12,"part":2,"pages":"67"},{"no":"49","ru":"Диаграммы","p":68,"id":"t68","sec":12,"part":2,"pages":"68–69"},{"no":"","ru":"Обобщающие задания","p":70,"id":"t69","sec":12,"part":2,"pages":"70–71"},{"no":"","ru":"Обобщающие задания за 1-й класс","p":72,"id":"t70","sec":12,"part":2,"pages":"72–73"}]}],"lesson":{"no":"10","topic_ru":"Сравнение чисел","topic_az":"Ədədlərin müqayisəsi","part":1,"pages":"33–34","workbook_pages":"26","standards":["1-1.1.5","1-2.1.2"],"next_standards":["1-1.1.3"],"plan":{"fields":[{"k":"f_topic","v":"10. Сравнение чисел. Учебник, ч. 1, с. 33–34; рабочая тетрадь, с. 26."},{"k":"f_standards","std":["1-1.1.5","1-2.1.2"],"v":"Программа 2024. В методичке 2020 у урока код 1.1.6 (старая нумерация)."},{"k":"f_goals","list":["Сравнивает две группы предметов, составляя пары, и говорит «больше», «меньше», «равно».","Записывает результат сравнения чисел до 10 знаками >, <, =.","Объясняет, почему одно число больше другого: по парам, по счёту или по числовой оси."]},{"k":"f_integration","v":"Русский язык — большие и маленькие буквы (сравнение по размеру); Познание мира — сравнение предметов по размеру; Изобразительное искусство — большие и маленькие предметы на рисунке."},{"k":"f_form","v":"Коллективная, в парах, в группах, индивидуальная."},{"k":"f_methods","v":"Игра «Голодный крокодил», составление пар (один к одному), моделирование кубиками, «Найди ошибку», самооценка «Светофор»."},{"k":"f_equipment","v":"Учебник (с. 33–34), рабочая тетрадь (с. 26), карточки с кружками от 1 до 10, знаки >, <, = из картона, крокодил на палочке, кубики или счётные палочки, слайды, рабочие листы A/B/C, карточки для групп."}],"stages":[{"st":"st_1","min":5,"form":"коллективная","steps":["Учитель держит в одной руке 3 пуговицы, в другой — 5: «В какой руке больше? Как проверить, не пересчитывая?»","Дети предлагают разложить пуговицы парами. Где остались пуговицы без пары — там больше.","Проблемный вопрос: «Как записать „пять больше трёх“ коротко, без слов?»"]},{"st":"st_2","min":10,"form":"в парах","steps":["Каждая пара получает две карточки с кружками (например, 6 и 4) и кубики.","На каждый кружок кладут кубик и выстраивают кубики двух карточек парами.","Находят, где остались кубики без пары, и говорят: «Шесть больше четырёх», «Четыре меньше шести».","Учитель показывает знаки > и < и крокодила: пасть всегда открыта к большему числу (слайды 2–5)."]},{"st":"st_3","min":8,"form":"коллективная","steps":["Пары называют свои числа, учитель записывает на доске: 6 > 4, 4 < 6, 5 = 5. Читаем записи хором.","Вопрос: «Почему 6 > 4 и 4 < 6 — это об одном и том же?»","Учебник, с. 33: дети рассматривают образцы записи и объясняют их своими словами.","Числовая ось на слайде 6: из двух чисел больше то, которое стоит правее."]},{"st":"st_4","min":4,"form":"коллективная","steps":["Больше то число, в группе которого остаются предметы без пары; при счёте его называют позже.","Знак открыт к большему числу, острый уголок смотрит на меньшее.","Если пар хватило всем — числа равны, ставим знак «=»."]},{"st":"st_5","min":10,"form":"индивидуальная, групповая","steps":["Рабочие листы по уровням: A — базовый, B — средний, C — высокий (5 мин).","Учебник, с. 34 — задания по выбору учителя (ответы — в тетради, учебник не подписываем).","Или карточки для групп (2–6 групп): каждая группа объясняет своё задание у доски.","Игра «Миллионер» на доске: 3–4 вопроса всем классом."]},{"st":"st_6","min":5,"form":"индивидуальная","steps":["Самооценка «Светофор» (слайд 8): зелёный — понял и могу объяснить; жёлтый — понял, но нужна помощь; красный — пока не понял.","Учитель отмечает учеников под наблюдением по критериям ниже (уровни I–IV)."]},{"st":"st_7","min":3,"form":"индивидуальная","steps":["Найти дома две группы предметов (ложки и вилки, чашки и блюдца), сравнить их парами и записать 2 сравнения знаками.","Рабочая тетрадь, с. 26 — по выбору учителя."]}],"criteria":[{"c":"Сравнивает две группы предметов, составляя пары (1-1.1.5)","levels":["Не может сравнить группы даже с помощью.","Сравнивает группы с помощью учителя.","Сравнивает группы парами, иногда ошибается.","Сам сравнивает группы и показывает «лишние» предметы."]},{"c":"Записывает сравнение знаками >, <, = (1-2.1.2)","levels":["Путает знаки.","Ставит знак верно только с подсказкой.","Ставит знаки верно, читает запись с ошибками.","Верно ставит и читает знаки: «шесть больше четырёх»."]},{"c":"Объясняет выбор знака (1-1.1.5, 1-2.1.2)","levels":["Не объясняет выбор.","Объясняет по наводящим вопросам.","Объясняет одним способом.","Объясняет двумя способами: парами и по числовой оси."]}],"sources":["Методичка «Математика. 1 класс» (2020, гриф 2020-004), раздел 3, тема 10, с. 60–63: место урока, цели (у нас — своими словами), приём «пасть крокодила», интеграция, страницы учебника и рабочей тетради.","Учебник «Математика. 1 класс», ч. 1, с. 33–34 — только ссылки на страницы, тексты и рисунки не копируем.","Стандарты — программа по математике 2024 (1-1.1.5, 1-2.1.2).","Добавлено нами: ход урока по минутам, критерии I–IV, все задания, рабочие листы, карточки, игра, слайды и рисунки."]},"slides":[{"t":"title","title":"Сравнение чисел","sub":"Математика · 1 класс · урок 10","note":"Покажите крокодила: сегодня он поможет нам сравнивать числа. Спросите, что дети уже знают о словах «больше» и «меньше»."},{"t":"rows","title":"Где больше?","a":5,"ca":"red","b":3,"cb":"blue","text":"Каких кружков больше — красных или синих?","note":"Пусть дети сначала угадают на глаз, а потом предложат способ проверить, не пересчитывая."},{"t":"pairs","title":"Составим пары","a":5,"ca":"red","b":3,"cb":"blue","text":"Двум красным не хватило пары. Красных больше: 5 > 3","note":"Выведите правило: где остались предметы без пары — там больше. Это главный способ урока."},{"t":"signs","title":"Знаки сравнения","rows":[["8 > 3","восемь больше трёх"],["2 < 6","два меньше шести"],["4 = 4","четыре равно четырём"]],"note":"Дети читают записи хором. Обратите внимание: читаем слева направо, как обычный текст."},{"t":"croc","title":"Крокодил ест большее","a":9,"b":4,"text":"Пасть открыта к большему числу: 9 > 4","note":"Покажите крокодила на палочке. Пусть дети по очереди ставят его между числами на доске."},{"t":"axis","title":"Числовая ось подсказывает","marks":[3,7],"text":"Правее — значит больше: 7 > 3","note":"Мостик к следующему уроку «Числовая ось»: числа на оси стоят по порядку, как при счёте."},{"t":"try","title":"Сравни сам","items":[[5,8],[9,2],[6,6]],"note":"Нажмите на кружок — появится знак. Сначала спросите класс, потом откройте ответ."},{"t":"reflect","title":"Как я понял тему?","items":[["green","Понял и могу объяснить"],["yellow","Понял, но нужна помощь"],["red","Пока не понял"]],"note":"Самооценка «Светофор»: дети поднимают карточку нужного цвета. Запишите, кому нужна помощь."}],"worksheets":{"A":{"tasks":[{"q":"Посчитай кружки и поставь знак >, < или =.","std":"1-1.1.5","items":[{"pic":{"t":"dots2","a":4,"b":2},"a":">","v":"sign(4,2)"},{"pic":{"t":"dots2","a":3,"b":3},"a":"=","v":"sign(3,3)"},{"pic":{"t":"dots2","a":1,"b":5},"a":"<","v":"sign(1,5)"}]},{"q":"Поставь знак >, < или =.","std":"1-2.1.2","items":[{"q":"2 ◯ 7","a":"<","v":"sign(2,7)"},{"q":"8 ◯ 3","a":">","v":"sign(8,3)"},{"q":"6 ◯ 6","a":"=","v":"sign(6,6)"},{"q":"0 ◯ 1","a":"<","v":"sign(0,1)"}]},{"q":"Обведи большее число.","std":"1-1.1.5","items":[{"q":"5 и 9","a":"9","v":"str(max(5,9))"},{"q":"7 и 4","a":"7","v":"str(max(7,4))"},{"q":"10 и 8","a":"10","v":"str(max(10,8))"}]},{"q":"Обведи меньшее число.","std":"1-1.1.5","items":[{"q":"3 и 6","a":"3","v":"str(min(3,6))"},{"q":"9 и 2","a":"2","v":"str(min(9,2))"},{"q":"1 и 0","a":"0","v":"str(min(1,0))"}]},{"q":"Нарисуй кружков больше, чем треугольников.","std":"1-1.1.5","items":[{"pic":{"t":"tri","n":3},"a":"4, 5, 6, 7, 8, 9, 10","note":"подойдёт любое из этих чисел","v":"fmt([x for x in R if x > 3])"}]}]},"B":{"tasks":[{"q":"Поставь знак >, < или =.","std":"1-2.1.2","items":[{"q":"7 ◯ 9","a":"<","v":"sign(7,9)"},{"q":"10 ◯ 6","a":">","v":"sign(10,6)"},{"q":"4 ◯ 4","a":"=","v":"sign(4,4)"},{"q":"5 ◯ 8","a":"<","v":"sign(5,8)"},{"q":"9 ◯ 0","a":">","v":"sign(9,0)"},{"q":"3 ◯ 2","a":">","v":"sign(3,2)"}]},{"q":"Верно или неверно? Поставь ✓ или ✗.","std":"1-2.1.2","items":[{"q":"6 > 4","a":"верно","v":"yes_no(true('6 > 4'))"},{"q":"2 > 5","a":"неверно","v":"yes_no(true('2 > 5'))"},{"q":"7 = 7","a":"верно","v":"yes_no(true('7 = 7'))"},{"q":"8 < 3","a":"неверно","v":"yes_no(true('8 < 3'))"},{"q":"1 < 10","a":"верно","v":"yes_no(true('1 < 10'))"}]},{"q":"Впиши в окошко подходящее число (от 0 до 10).","std":"1-1.1.5","items":[{"q":"5 > ▢","a":"0, 1, 2, 3, 4","note":"любое из чисел","v":"fmt([x for x in R if 5 > x])"},{"q":"▢ < 3","a":"0, 1, 2","note":"любое из чисел","v":"fmt([x for x in R if x < 3])"},{"q":"8 = ▢","a":"8","v":"fmt([x for x in R if x == 8])"},{"q":"▢ > 9","a":"10","v":"fmt([x for x in R if x > 9])"}]},{"q":"Запиши числами и знаком.","std":"1-2.1.2","items":[{"q":"Шесть больше двух.","a":"6 > 2","v":"rel(6,2)"},{"q":"Три меньше семи.","a":"3 < 7","v":"rel(3,7)"},{"q":"Пять равно пяти.","a":"5 = 5","v":"rel(5,5)"}]},{"q":"У Лейлы 6 карандашей, у Тимура 4. У кого больше? Запиши сравнение.","std":"1-1.1.5","items":[{"a":"У Лейлы: 6 > 4","v":"('У Лейлы' if 6 > 4 else 'У Тимура') + ': ' + rel(6,4)"}]}]},"C":{"tasks":[{"q":"Поставь знак >, < или =.","std":"1-2.1.2","items":[{"q":"9 ◯ 10","a":"<","v":"sign(9,10)"},{"q":"0 ◯ 0","a":"=","v":"sign(0,0)"},{"q":"7 ◯ 6","a":">","v":"sign(7,6)"},{"q":"2 ◯ 9","a":"<","v":"sign(2,9)"}]},{"q":"Найди ошибки и исправь знак.","std":"1-2.1.2","items":[{"q":"5 < 3","a":"ошибка: 5 > 3","v":"fix('5 < 3')"},{"q":"8 > 6","a":"верно","v":"fix('8 > 6')"},{"q":"4 = 7","a":"ошибка: 4 < 7","v":"fix('4 = 7')"},{"q":"10 > 9","a":"верно","v":"fix('10 > 9')"},{"q":"1 > 2","a":"ошибка: 1 < 2","v":"fix('1 > 2')"}]},{"q":"Какие числа можно вписать в окошко?","std":"1-1.1.5","items":[{"q":"4 < ▢ < 8","a":"5, 6, 7","v":"fmt([x for x in R if 4 < x < 8])"},{"q":"0 < ▢ < 3","a":"1, 2","v":"fmt([x for x in R if 0 < x < 3])"}]},{"q":"Отгадай число.","std":"1-1.1.5","items":[{"q":"Я больше 6, но меньше 8.","a":"7","v":"str(only([x for x in R if 6 < x < 8]))"},{"q":"Я меньше 3, но больше 1.","a":"2","v":"str(only([x for x in R if 1 < x < 3]))"}]},{"q":"У Айсель 7 наклеек, у Мурада 9. Мурад подарил Айсель 1 наклейку. У кого теперь больше? Нарисуй кружки и проверь.","std":"1-1.1.5","items":[{"a":"Поровну: 8 = 8","v":"('Поровну' if 7 + 1 == 9 - 1 else 'Не поровну') + ': ' + rel(7 + 1, 9 - 1)"}]}]}},"cards":[{"title":"Пары","color":"red","std":"1-1.1.5","q":"Нарисуйте 6 яблок и 4 груши. Соедините их парами. Чего больше? Запишите сравнение знаком.","a":"Яблок больше, два яблока остались без пары: 6 > 4","v":"rel(6,4)","vin":"a"},{"title":"Крокодил","color":"green","std":"1-2.1.2","q":"Поставьте между числами знак-крокодила: 3 ◯ 8 · 7 ◯ 7 · 9 ◯ 5.","a":"3 < 8 · 7 = 7 · 9 > 5","v":"' · '.join([rel(3,8), rel(7,7), rel(9,5)])"},{"title":"Числовая ось","color":"blue","std":"1-1.1.5","q":"Начертите ось от 0 до 10. Отметьте числа 2 и 6. Какое число правее? Запишите два сравнения.","a":"6 правее: 6 > 2 и 2 < 6","v":"str(max(2,6)) + ' правее: ' + rel(6,2) + ' и ' + rel(2,6)"},{"title":"Найдите ошибки","color":"orange","std":"1-2.1.2","q":"Какие записи неверные? Исправьте их: 9 < 4 · 3 = 3 · 5 > 8 · 10 > 1.","a":"Неверно: 9 < 4 (надо 9 > 4) и 5 > 8 (надо 5 < 8)","v":"'Неверно: ' + ' и '.join(s + ' (надо ' + rel(int(s.split()[0]), int(s.split()[2])) + ')' for s in ['9 < 4', '3 = 3', '5 > 8', '10 > 1'] if not true(s))"},{"title":"Загадки","color":"purple","std":"1-1.1.5","q":"Отгадайте числа: 1) я больше 4, но меньше 6; 2) я меньше 1; 3) я больше 8, но меньше 10.","a":"1) 5; 2) 0; 3) 9","v":"'1) %d; 2) %d; 3) %d' % (only([x for x in R if 4 < x < 6]), only([x for x in R if x < 1]), only([x for x in R if 8 < x < 10]))"},{"title":"Составьте сами","color":"teal","std":"1-2.1.2","q":"Возьмите карточки с числами 2, 5 и 9. Составьте три верные записи со знаками > или <.","a":"Например: 2 < 5, 5 < 9, 9 > 2. Подходят все пары: 2 < 5, 2 < 9, 5 < 9 и записи с «>» в обратном порядке","v":"', '.join(rel(a, b) for a, b in [(2,5), (5,9), (9,2)])","vin":"a"}],"infographic":{"title":"Как сравнить два числа","steps":[{"n":1,"title":"Посчитай","text":"Сколько предметов в каждой группе?","pic":{"t":"dots2","a":6,"b":4}},{"n":2,"title":"Сравни","text":"Составь пары. Где остались предметы без пары — там больше. На числовой оси большее число стоит правее.","pic":{"t":"pairs","a":6,"b":4}},{"n":3,"title":"Поставь знак","text":"Крокодил открывает пасть к большему числу.","pic":{"t":"croc","a":6,"b":4}}],"signs":[[">","больше"],["<","меньше"],["=","равно"]],"read":[{"e":"6 > 4","w":"шесть больше четырёх","v":"rel(6,4)"},{"e":"4 < 6","w":"четыре меньше шести","v":"rel(4,6)"},{"e":"5 = 5","w":"пять равно пяти","v":"rel(5,5)"}]},"quiz":[{"q":"Какой знак читается «меньше»?","opts":["<",">","=","+"],"a":0,"v":"SIGN['меньше']","hint":"Острый уголок знака смотрит на меньшее число."},{"q":"Каких кружков больше?","pic":{"t":"rows","a":5,"ca":"red","b":3,"cb":"blue"},"opts":["Синих","Красных","Поровну","Нет кружков"],"a":1,"v":"'Красных' if 5 > 3 else 'Синих' if 3 > 5 else 'Поровну'","hint":"Составь пары: красный — синий. Кому не хватило пары?"},{"q":"Какой знак нужен: 6 ◯ 2?","opts":["<","=",">","+"],"a":2,"v":"sign(6,2)","hint":"Крокодил открывает пасть к большему числу."},{"q":"Какой знак нужен: 4 ◯ 9?","opts":[">","=","<","+"],"a":2,"v":"sign(4,9)","hint":"Какое число при счёте называют позже?"},{"q":"Какой знак нужен: 7 ◯ 7?","opts":["<",">","+","="],"a":3,"v":"sign(7,7)","hint":"Числа одинаковые."},{"q":"Какая запись верная?","opts":["3 > 5","8 < 2","6 > 1","4 = 0"],"a":2,"v":"only_true(opts)","hint":"Проверь каждую запись: широкая сторона знака — к большему числу."},{"q":"Какое число меньше 4?","opts":["2","9","6","4"],"a":0,"v":"only([o for o in opts if int(o) < 4])","hint":"4 не меньше 4 — эти числа равны."},{"q":"Я больше 5, но меньше 7. Кто я?","opts":["5","8","7","6"],"a":3,"v":"only([o for o in opts if 5 < int(o) < 7])","hint":"Посчитай: 5, …, 7. Какое число в середине?"},{"q":"На числовой оси число 8 стоит правее числа 3. Что верно?","opts":["8 < 3","8 > 3","8 = 3","3 > 8"],"a":1,"v":"only_true(opts)","hint":"Правее — значит больше."},{"q":"У Нигяр 4 мяча, у Эмиля 6. Что верно?","opts":["У Нигяр больше","Поровну","У Эмиля больше","У Нигяр на 6 больше"],"a":2,"v":"'У Нигяр больше' if 4 > 6 else 'У Эмиля больше' if 6 > 4 else 'Поровну'","hint":"Составь пары из мячей Нигяр и Эмиля."}],"quiz_points":[100,200,300,500,1000,2000,4000,8000,16000,32000],"downloads":[{"ru":"План урока","az":"Dərs planı","fmt":["Word","PDF"]},{"ru":"Слайды","az":"Slaydlar","fmt":["PowerPoint","PDF"]},{"ru":"Рабо ru":"4 задания разным группам","sub_az":"Qruplara 4 tapşırıq"},{"id":"slide","ru":"Слайд","az":"Slayd","sub_ru":"Один слайд 16:9","sub_az":"Bir slayd 16:9"}],"clouds":[{"title":"Анализируем! Объясняем!","c":"pink"},{"title":"Сравниваем! Отвечаем!","c":"blue"},{"title":"Обсуждаем! Отвечаем!","c":"green"}],"placeholder":{"text":"Здесь будет текст по теме «{topic}» для {grade} класса. В рабочей версии его напишет ИИ — по программе и словарю терминов, без текстов учебника.","question":"Вопрос к тексту составит ИИ","node":"понятие","rule":"Правило по теме «{topic}» в рабочей версии сформулирует ИИ.","example":"пример","card":"Задание для группы по теме «{topic}» в рабочей версии напишет ИИ.","bullet":"Главная мысль слайда — её напишет ИИ"},"presets":[{"id":"math1","lesson_id":"RU-mat-1-013","lesson_topic":"Сравнение чисел","keys":["сравнение чисел","сравниваем числа","сравни"],"subject_ru":"Математика","subject_az":"Riyaziyyat","grade":1,"topic":"Сравнение чисел","title":"Каштаны в парке","text":["Лейла и Тимур гуляли в парке и собирали каштаны. Лейла нашла 7 каштанов, а Тимур — 5.","Дети разложили каштаны на скамейке парами: каштан Лейлы — рядом с каштаном Тимура. Два каштана Лейлы остались без пары.","— У меня больше! — обрадовалась Лейла.","Тимур подумал и ответил: — Значит, у меня на два меньше. Завтра найду ещё два каштана, и у нас станет поровну."],"facts":[{"q":"7 ◯ 5","a":">","v":"sign(7,5)"},{"q":"без пары","a":"2","v":"str(7 - 5)"},{"q":"завтра у Тимура","a":"7","v":"str(5 + 2)"}],"questions":[["Сколько каштанов нашла Лейла? А Тимур?","Зачем дети разложили каштаны парами?"],["У кого каштанов больше? Запиши знаком: 7 ◯ 5.","Сколько каштанов осталось без пары?"],["Прав ли Тимур, что завтра станет поровну? Почему?","Как ещё можно узнать, какое число больше?"]],"cluster":{"center":"Сравнение чисел","nodes":["больше >","меньше <","равно =","пары","числовая ось","крокодил"]},"poster":{"title":"Как сравнить два числа","rule":"Больше то число, которое при счёте называют позже. Знак сравнения открыт к большему числу.","examples":[["7 > 5","семь больше пяти"],["3 < 8","три меньше восьми"],["4 = 4","четыре равно четырём"]]},"cards":[{"q":"Разложите 6 красных и 4 синие фишки парами. Каких фишек больше? Запишите знаком.","a":"Красных больше: 6 > 4","v":"'Красных больше: ' + rel(6,4)"},{"q":"Поставьте знаки: 9 ◯ 3, 2 ◯ 2, 1 ◯ 6.","a":"9 > 3, 2 = 2, 1 < 6","v":"', '.join([rel(9,3), rel(2,2), rel(1,6)])"},{"q":"Какое число стоит на числовой оси между 4 и 6?","a":"5","v":"str(only([x for x in R if 4 < x < 6]))"},{"q":"Придумайте задачу про 8 и 5 яблок, в которой нужно сравнить числа.","a":"Например: у Нигяр 8 яблок, у Эмиля 5. У кого больше? 8 > 5","v":"rel(8,5)","vin":"a"}],"slide":{"title":"Сравниваем числа","bullets":["Составь пары: где остались лишние — там больше","Знаки: > больше, < меньше, = равно","На числовой оси правее — значит больше: 7 > 5"]}},{"id":"rus2","lesson_id":"RU-rus-2-080","lesson_topic":"Осенние страницы","keys":["осенние страницы","осенний букет","осен","листопад","листья"],"subject_ru":"Русский язык","subject_az":"Rus dili","grade":2,"topic":"Осенние страницы","title":"Осенний букет","text":["В субботу Айсель с бабушкой пошли в парк. Под ногами шуршали листья: жёлтые, оранжевые, красные.","Айсель собрала букет. В нём был кленовый лист, похожий на ладошку, дубовый лист с волнистыми краями и длинный лист каштана.","— Бабушка, почему летом листья были зелёными, а теперь разноцветные? — спросила девочка.","— Летом в листьях много зелёного вещества. К осени его становится меньше, и проступают другие краски, — объяснила бабушка.","Дома Айсель положила листья между страницами толстой книги. «Зимой у меня будет кусочек осени», — подумала она."],"questions":[["Какие листья собрала Айсель в букет?","Почему кленовый лист похож на ладошку?"],["Чем дубовый лист отличается от листа каштана?","Какими листья были летом и какими стали осенью?"],["Зачем Айсель положила листья в книгу?","Как вы понимаете слова «кусочек осени»?"]],"cluster":{"center":"Осень","nodes":["листопад","жёлтые листья","букет","прохладно","птицы улетают","дожди"]},"poster":{"title":"Гласные после шипящих","rule":"После Ж и Ш всегда пишем И, даже если слышим Ы. После Ч и Щ пишем А и У, даже если слышим Я и Ю.","examples":[["шишка","ШИ"],["лыжи","ЖИ"],["чаща","ЧА"],["роща","ЩА"],["чудо","ЧУ"],["щука","ЩУ"]]},"cards":[{"q":"Найдите в тексте слова, которые описывают листья. Запишите их.","a":"жёлтые, оранжевые, красные, похожий на ладошку, с волнистыми краями, длинный","in_text":["жёлтые","оранжевые","красные","похожий на ладошку","с волнистыми краями","длинный"]},{"q":"Нарисуйте три листа из букета Айсель и подпишите, с какого они дерева.","a":"клён, дуб, каштан","in_text":["кленовый","дубовый","каштана"]},{"q":"Прочитайте по ролям разговор Айсель и бабушки.","a":"Вопрос Айсель и ответ бабушки — две реплики"},{"q":"Придумайте продолжение: что Айсель сделает с листьями зимой?","a":"Ответы детей: открытку, аппликацию, гербарий"}],"slide":{"title":"Осенний букет","bullets":["Какие листья собрала Айсель?","Почему осенью листья разноцветные?","Что значит «кусочек осени»?"]}},{"id":"pm3","lesson_id":"RU-pm-3-017","lesson_topic":"Свет и тень","keys":["свет и тень","тень","тени","свет"],"subject_ru":"Познание мира","subject_az":"Həyat bilgisi","grade":3,"topic":"Свет и тень","title":"Тень Рауфа","text":["Утром Рауф вышел во двор и увидел рядом с собой длинную тёмную фигуру. Это была его тень.","Тень появляется, когда предмет загораживает путь свету. Свет идёт по прямой и не может обойти предмет. Поэтому за предметом, с другой стороны от источника света, остаётся тёмное место — тень.","В полдень Солнце поднялось высоко, и тень Рауфа стала короткой. Вечером Солнце опустилось низко, и тень снова вытянулась.","Через прозрачное оконное стекло свет проходит, поэтому от стекла почти нет тени. А от деревянной двери тень тёмная."],"questions":[["Почему появляется тень?","С какой стороны от предмета бывает тень?"],["Когда тень длиннее — утр     s += `<text x="${x}" y="${y + 24}" font-size="${on ? 17 : 14}" font-weight="${on ? 800 : 500}" text-anchor="middle" fill="${on ? '#2f6fed' : '#5a6476'}">${i}</text>`;
    if (on) s += `<circle cx="${x}" cy="${y}" r="8" fill="#2f6fed"/>`;
  }
  return s;
}
function axisSvg(marks) { return `<svg viewBox="0 0 330 64" width="330" height="64" aria-hidden="true">${axisG(marks, 16, 22, 28, 10)}</svg>`; }
function pairsPic(a, b) { return rowsSvg(a, 'red', b, 'blue', true); }
function picHtml(p) {
  if (!p) return '';
  if (p.t === 'rows') return `<span class="pic">${rowsSvg(p.a, p.ca, p.b, p.cb, false)}</span>` +

  if (p.t === 'pairs') return `<span class="pic">${pairsPic(p.a, p.b)}</span>`;

/* ---------- слайды ---------- */
function svgText(x, y, s, size, opts) {
  opts = opts || {};
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${opts.w || 700}" text-anchor="${opts.a || 'start'}" fill="${opts.c || '#1b2333'}">${esc(s)}</text>`;
}
/* Подпись по центру слайда: если не влезает в 300 единиц — две строки. */
function svgCaption(x, y, s, size, w) {
  if (s.length * size * 0.56 <= 300) return svgText(x, y, s, size, {a: 'middle', w: w || 700});
  const mid = s.length / 2;
  let cut = -1;
  for (let k = 0; k < s.length; k++) if (s[k] === ' ' && (cut < 0 || Math.abs(k - mid) < Math.abs(cut - mid))) cut = k;
  return svgText(x, y - 8, s.slice(0, cut), size, {a: 'middle', w: w || 700}) + svgText(x, y + 9, s.slice(cut + 1), size, {a: 'middle', w: w || 700});
}
function slideSvg(sl, i) {
  let b = `<rect width="320" height="180" fill="#fff"/><rect width="320" height="6" fill="#2f6fed"/>`;
  b += svgText(306, 172, `${i + 1}`, 10, {a: 'end', c: '#9aa4b8', w: 600});
  const title = (y) => svgText(16, y || 32, sl.title, Math.min(19, 275 / (sl.title.length * 0.6)), {w: 800});
  if (sl.t === 'title') {
    b += `<rect x="0" y="6" width="320" height="174" fill="#f2f6ff"/>`;
    b += svgText(160, 62, sl.title, 30, {a: 'middle', w: 900});
    b += svgText(160, 86, sl.sub, 12, {a: 'middle', c: '#5a6476', w: 600});
    b += `<g transform="translate(78 98) scale(0.72)">${crocG('gt')}</g>`;
    b += svgText(196, 138, '8 > 5', 26, {w: 900, c: '#2f6fed'});
  } else if (sl.t === 'rows' || sl.t === 'pairs') {
    b += title();
    const w = Math.max(sl.a, sl.b) * 30 + 16;
    b += `<g transform="translate(${(320 - w) / 2} 44)">${rowsSvg(sl.a, sl.ca, sl.b, sl.cb, sl.t === 'pairs').replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>`;
    b += svgCaption(160, 158, sl.text, 12.5);
    if (PRINT) b += svgText(306, 30, '● красные   ○ синие', 9.5, {a: 'end', w: 600});
  } else if (sl.t === 'signs') {
    b += title();
    sl.rows.forEach((r, k) => {
      const y = 72 + k * 40;
      b += `<rect x="14" y="${y - 26}" width="292" height="34" rx="9" fill="${['#e9f0ff', '#fff4dc', '#e2f6ea'][k]}"/>`;
      b += svgText(28, y, r[0], 24, {w: 900});
      b += svgText(118, y - 2, r[1], 14, {w: 600, c: '#3b4456'});
    });
  } else if (sl.t === 'croc') {
    b += title();
    b += `<g transform="translate(30 42)">${crocPairSvg(sl.a, sl.b).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>`;
    b += svgCaption(160, 158, sl.text, 13);
  } else if (sl.t === 'axis') {
    b += title();
    b += `<g transform="translate(-4 66)">${axisG(sl.marks, 22, 22, 28, 10)}</g>`;
    b += svgCaption(160, 152, sl.text, 14);
  } else if (sl.t === 'try') {
    b += title();
    sl.items.forEach((p, k) => {
      const y = 70 + k * 36;
      b += svgText(110, y + 9, String(p[0]), 26, {a: 'end', w: 900});
      b += `<g class="try-g" data-act="reveal"><rect x="40" y="${y - 18}" width="200" height="36" fill="transparent"/><circle cx="140" cy="${y}" r="15" fill="#fff" stroke="#2f6fed" stroke-width="2.5" stroke-dasharray="4 3"/>`;
      b += `<text class="q" x="140" y="${y + 5}" font-size="13" text-anchor="middle" fill="#9aa4b8" font-weight="700">?</text>`;
      b += `<text class="s" x="140" y="${y + 9}" font-size="24" text-anchor="middle" fill="#1f9d55" font-weight="900">${esc(signOf(p[0], p[1]))}</text></g>`;
      b += svgText(170, y + 9, String(p[1]), 26, {w: 900});
    });
  } else if (sl.t === 'reflect') {
    b += title();
    b += `<rect x="24" y="44" width="52" height="128" rx="14" fill="#1b2333"/>`;
    sl.items.forEach((it, k) => {
      const y = 66 + k * 40, c = {green: '#22c55e', yellow: '#f2b705', red: '#ef4444'}[it[0]];
      b += `<circle cx="50" cy="${y}" r="15" fill="${c}"/>`;
      b += svgText(92, y + 5, it[1], 14, {w: 700});
    });
  }
  return `<svg viewBox="0 0 320 180" role="img" aria-label="${esc(sl.title)}">${b}</svg>`;
}

/* ---------- проверка: расчёты ---------- */
function results(g) {
  const ch = C.checks[g];
  return C.students.map((name, i) => {
    const ans = ch.answers[i];
    const per = ch.tasks.map((tk, j) => ans[j] === tk.a);
    const correct = per.filter(Boolean).length;
    const crit = ch.criteria.map(c => ({id: c.id, ok: c.tasks.filter(n => per[n - 1]).length, of: c.tasks.length}));
    const r = {i, name, ans, per, correct, crit};
    if (ch.kind === 'levels') {
      r.level = ch.levels.find(l => correct >= l.min);
    } else {
      r.points = correct * ch.points_per_task;
      r.mark = ch.marks.find(m => r.points >= m.min).mark;
      r.critPts = crit.map(c => Math.max(1, c.ok));
      r.critAvg = r.critPts.reduce((a, b) => a + b, 0) / r.critPts.length;
      r.critLevel = roman(r.critAvg);
    }
    return r;
  });
}
function roman(avg) { return avg >= 3.5 ? 'IV' : avg >= 2.5 ? 'III' : avg >= 1.5 ? 'II' : 'I'; }
function gaps(g) {
  const ch = C.checks[g], rs = results(g);
  return ch.criteria.map(c => {
    const who = rs.filter(r => c.tasks.some(n => !r.per[n - 1]));
    const pts = rs.map(r => Math.max(1, c.tasks.filter(n => r.per[n - 1]).length));
    const avg = pts.reduce((a, b) => a + b, 0) / pts.length;
    return {c, who, wrong: who.length, avg, lvl: roman(avg)};
  });
}
function critLabel(c) { return `${c.id} · ${c.std}`; }

        document.getElementById('slideNo').textContent = t('slide_n', {i: slideIdx + 1, n: sl.length});
        document.getElementById('slideNote').textContent = sl[slideIdx].note;
        document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === slideIdx));
        document.getElementById('revealBtn').classList.toggle('hidden', sl[slideIdx].t !== 'try');
      };
      tr.addEventListener('scroll', () => { window.requestAnimationFrame(upd); }, {passive: true});
      if (slideIdx) tr.scrollLeft = slideIdx * tr.clientWidth;
      upd();
    }};
}

function itemHtml(it) {
  const one = it.a && !/[,:·]/.test(it.a) && it.a.length <= 3;
  let q = it.q ? esc(it.q) : '';
  let filled = false;
  if (q && one && (q.includes('◯') || q.includes('▢'))) {
    q = q.replace(/[◯▢]/, m => `<span class="blank${m === '▢' ? ' box' : ''}"><span class="fill">${esc(it.a)}</span></span>`);
    filled = true;
  } else if (q) {
    q = q.replace(/◯/g, '<span class="blank"></span>').replace(/▢/g, '<span class="blank box"></span>');
  }
  const pair = (it.q || '').match(/^(\d+) и (\d+)$/);
  if (pair && (it.a === pair[1] || it.a === pair[2])) {
    const n = x => `<span class="circ${x === it.a ? ' yes' : ''}">${x}</span>`;
    return `<div class="item pair">${n(pair[1])}<span class="muted" style="font-weight:500">и</span>${n(pair[2])}</div>`;
  }
  if (it.pic && it.pic.t === 'dots2') {
    return `<div class="item"><span class="pic">${dotsSvg(it.pic.a, '#e5484d')}</span><span class="blank"><span class="fill">${esc(it.a)}</span></span><span class="pic">${dotsSvg(it.pic.b, '#3b82f6')}</span></div>`;
  }
  const raw = it.q || '';
  const isText = !raw || raw.length > 12 || !!it.pic;
  const ans = filled ? '' : `<div class="ans">${esc(t('answer_word'))}: ${esc(it.a)}${it.note ? ` <span class="nt">(${esc(it.note)})</span>` : ''}</div>`;
  return `<div class="item${isText ? ' text' : ''}">${it.pic ? picHtml(it.pic) : ''}${q ? `<span>${q}</span>` : ''}${ans}</div>`;
}

let G = null;

function gameInner() {

      }).join('')}</div>

function boardShow(i) {
  if (!BOARD) return;
  const n = BOARD.pages.length;
  i = Math.max(0, Math.min(n - 1, i));
  BOARD.i = i;
  document.querySelectorAll('#bStage .b-page').forEach((p, k) => p.classList.toggle('hidden', k !== i));
  document.getElementById('bCount').textContent = n > 1 ? `${i + 1} / ${n}` : '';
  document.getElementById('bPrev').disabled = i === 0;
  document.getElementById('bNext').disabled = i === n - 1;
  document.querySelectorAll('#board .b-dots i').forEach((d, k) => d.classList.toggle('on', k === i));
  boardFit();
}
/* Уменьшаем шрифт страницы, пока она не поместится на доске без прокрутки. */
function boardFit() {
  const st = document.getElementById('bStage');
  const pg = st && st.querySelector('.b-page:not(.hidden)');
  if (!pg) return;
  let k = 1;
  const minK = window.innerWidth < 700 ? 0.8 : 0.42;
  pg.style.fontSize = '1em';
  while ((pg.scrollHeight > st.clientHeight - 24 || pg.scrollWidth > st.clientWidth - 48) && k > minK) {
    k -= 0.04;
    pg.style.fontSize = k.toFixed(2) + 'em';
  }
}
function boardRefreshLive() {
  if (!BOARD) return;
  BOARD.pages.forEach((p, k) => {
    if (typeof p !== 'function') return;
    const el = document.querySelector(`#bStage .b-page[data-p="${k}"]`);
    if (el) el.innerHTML = p();
  });
  boardFit();
}
function closeBoard() {
  const el = document.getElementById('board');
  BOARD = null;
  document.documentElement.classList.remove('board-open');
  if (el) el.remove();
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  if (fe) { const ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) { try { const pr = ex.call(document); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {} } }
}
function bindSwipe(el) {
  let x0 = null, y0 = 0;
  el.addEventListener('pointerdown', e => { if (e.target.closest('button')) { x0 = null; return; } x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (x0 == null || !BOARD) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2) boardShow(BOARD.i + (dx < 0 ? 1 : -1));
  });
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  if (!BOARD) return;
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  if (fe) BOARD.fs = true;
  else if (BOARD.fs) closeBoard();
}));
window.addEventListener('resize', () => { if (BOARD) boardFit(); });
